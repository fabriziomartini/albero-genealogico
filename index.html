<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>Albero genealogico Martini</title>
    <meta name="description" content="Albero genealogico interattivo della famiglia" />
  </head>
  <body>
    <div id="app">
      <header id="top-bar">
        <h1>Albero genealogico</h1>
        <div id="search-box">
          <input
            id="search-input"
            type="search"
            placeholder="Cerca per nome o cognome…"
            autocomplete="off"
          />
          <ul id="search-results" hidden></ul>
        </div>
      </header>

      <main id="chart-cont" class="f3"></main>

      <aside id="detail-panel" hidden>
        <button id="detail-close" aria-label="Chiudi">✕</button>
        <div id="detail-content"></div>
      </aside>

      <div id="loading">Caricamento albero…</div>
      <div id="error-banner" hidden></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
